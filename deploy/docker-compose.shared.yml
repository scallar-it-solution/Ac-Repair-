# Root-owned on the existing shared VPS. Caddy reaches only the edge; the app has no outbound network.
name: frostwright

services:
  web:
    image: ${IMAGE:?An immutable Docker Hub image is required}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  edge:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./shared-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      internal:
      proxy:
        aliases: [frostwright-edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  internal:
    internal: true
  proxy:
    external: true
    name: proxy_net
